<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 272" width="1200" height="272" role="img" aria-label="Tech stack: languages, frameworks and tools">
  <title>Tech stack</title>
  <defs>
    <style>
      .serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .tile  { opacity: 0; transform: translateY(10px); animation: pop .5s cubic-bezier(.2,.7,.3,1) forwards; }
      .lab   { opacity: 0; animation: fin .6s ease-out forwards; }
      @keyframes pop { to { opacity: 1; transform: translateY(0) } }
      @keyframes fin { to { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) {
        .tile, .lab { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>
