      .c5 { opacity: 0; animation: caret 0.52s steps(1, end) 1.01s forwards, walk5 0.52s steps(26) 1.01s both; }
      @keyframes walk5 { to { transform: translateX(241.8px) } }
      .l7 { animation: reveal 0.70s steps(66) 1.29s backwards; }
      .c7 { opacity: 0; animation: caret 0.70s steps(1, end) 1.29s forwards, walk7 0.70s steps(66) 1.29s both; }
      @keyframes walk7 { to { transform: translateX(613.8px) } }
      .l8 { animation: reveal 0.70s steps(54) 1.43s backwards; }
      .c8 { opacity: 0; animation: caret 0.70s steps(1, end) 1.43s forwards, walk8 0.70s steps(54) 1.43s both; }
      @keyframes walk8 { to { transform: translateX(502.2px) } }
