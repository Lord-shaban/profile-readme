      /* The hidden state lives in the keyframe, not on the element: with
         'backwards' fill the line is clipped only while its animation is
         pending, so if animations never run the code is simply all there. */
      .caret { opacity: 0; }
      @keyframes reveal { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }
      @keyframes caret  { 0%, 99% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes appear { from { opacity: 0 } to { opacity: 1 } }
      .l1 { animation: reveal 0.50s steps(25) 0.45s backwards; }
      .c1 { opacity: 0; animation: caret 0.50s steps(1, end) 0.45s forwards, walk1 0.50s steps(25) 0.45s both; }
      @keyframes walk1 { to { transform: translateX(232.5px) } }
      .l2 { animation: reveal 0.58s steps(29) 0.59s backwards; }
      .c2 { opacity: 0; animation: caret 0.58s steps(1, end) 0.59s forwards, walk2 0.58s steps(29) 0.59s both; }
