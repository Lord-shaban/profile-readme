      /* 'backwards', not a base opacity of 0: if the animation never runs the
         status bar stays visible instead of disappearing permanently. */
      .status { animation: appear .4s ease-out 2.29s backwards; }
      
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .anim, .fx { opacity: 1 !important; transform: none !important; clip-path: none !important; }
  }
    </style>
