<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 184" width="560" height="184" role="img" aria-label="NeuroBalance — Cognitive training experiment — testing whether short daily drills hold attention better than long sessions.">
  <title>NeuroBalance — Cognitive training experiment — testing whether short daily drills hold attention better than long sessions.</title>
  <defs>
    
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, system-ui, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      
      .rise { animation: rise .5s cubic-bezier(.2,.7,.3,1) .05s backwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .anim, .fx { opacity: 1 !important; transform: none !important; clip-path: none !important; }
  }
    </style>
  </defs>
  <rect width="560" height="184" rx="8" fill="#1A1B26"/>

  <rect x="0.5" y="0.5" width="559" height="183" rx="10" fill="#1F2335" stroke="#292E42"/>
  <path d="M0 10 a10 10 0 0 1 10 -10 h1 v184 h-1 a10 10 0 0 1 -10 -10 z" fill="#7DCFFF"/>

  <g class="fx rise">
    <circle cx="33" cy="41" r="5.5" fill="#7DCFFF"/>
    <text class="sans" x="48" y="47" font-size="19" font-weight="600" fill="#C0CAF5">NeuroBalance</text>

    

    <text class="sans" x="28" y="80" font-size="13.5" fill="#565F89">Cognitive training experiment — testing whether short</text>
    <text class="sans" x="28" y="101" font-size="13.5" fill="#565F89">daily drills hold attention better than long sessions.</text>

    <g>
      <rect x="28" y="138" width="66.2" height="22" rx="5" fill="#7DCFFF" fill-opacity="0.12"/>
      <text class="mono" x="61.1" y="153" text-anchor="middle" font-size="11" fill="#7DCFFF" fill-opacity="0.95">Flutter</text>
    </g>
    <g>
