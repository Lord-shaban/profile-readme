<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 176" width="560" height="176" role="img" aria-label="Top 10 — Real-time football trivia. You and your friends race to name the top ten before anyone else does.">
  <title>Top 10 — Real-time football trivia. You and your friends race to name the top ten before anyone else does.</title>
  <defs>
    <pattern id="ground" width="64" height="64" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="#C9A227" stroke-width="1">
      <rect x="16.8" y="16.8" width="30.4" height="30.4"/><rect x="16.8" y="16.8" width="30.4" height="30.4" transform="rotate(45 32 32)"/>
      <rect x="-15.2" y="-15.2" width="30.4" height="30.4"/><rect x="-15.2" y="-15.2" width="30.4" height="30.4" transform="rotate(45 0 0)"/>
      <rect x="48.8" y="-15.2" width="30.4" height="30.4"/><rect x="48.8" y="-15.2" width="30.4" height="30.4" transform="rotate(45 64 0)"/>
      <rect x="-15.2" y="48.8" width="30.4" height="30.4"/><rect x="-15.2" y="48.8" width="30.4" height="30.4" transform="rotate(45 0 64)"/>
      <rect x="48.8" y="48.8" width="30.4" height="30.4"/><rect x="48.8" y="48.8" width="30.4" height="30.4" transform="rotate(45 64 64)"/>
    </g>
  </pattern>
    <style>
      .serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .ar    { font-family: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", "Segoe UI", Tahoma, serif; }
      
      .rise { opacity: 0; transform: translateY(6px); animation: rise .55s cubic-bezier(.2,.7,.3,1) .05s forwards; }
      @keyframes rise { to { opacity: 1; transform: translateY(0) } }
      
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .anim { opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
  }
    </style>
  </defs>
  <rect width="560" height="176" fill="#0B0F14"/>

  <rect x="0.5" y="0.5" width="559" height="175" rx="2" fill="#10161E" stroke="#C9A227" stroke-opacity="0.28"/>
  <rect x="0.5" y="0.5" width="559" height="175" rx="2" fill="url(#ground)" opacity="0.10"/>
  <rect x="0" y="0" width="3" height="176" fill="#C9A227" fill-opacity="0.9"/>

  <g class="anim rise">
    <text class="serif" x="26" y="46" font-size="23" letter-spacing="0.4" fill="#C9A227">Top 10</text>

    <g fill="#C9A227" fill-opacity="0.75" transform="translate(500 40)"><polygon points="0.00,-7.00 1.73,-2.38 6.66,-2.16 2.80,0.91 4.11,5.66 0.00,2.94 -4.11,5.66 -2.80,0.91 -6.66,-2.16 -1.73,-2.38"/></g>
    <text class="mono" x="534" y="45" text-anchor="end" font-size="12" fill="#F2E9D8" fill-opacity="0.7">1</text>

    <text class="mono" x="26" y="76" font-size="11.5" fill="#F2E9D8" fill-opacity="0.68">Real-time football trivia. You and your friends race to name the top</text>
    <text class="mono" x="26" y="95" font-size="11.5" fill="#F2E9D8" fill-opacity="0.68">ten before anyone else does.</text>

    <g>
    <rect x="26" y="132" width="82.0" height="20" rx="2" fill="#C9A227" fill-opacity="0.10" stroke="#C9A227" stroke-opacity="0.34"/>
    <text class="mono" x="67.0" y="146" text-anchor="middle" font-size="10" fill="#C9A227" fill-opacity="0.95">JavaScript</text>
  </g>
    <g>
    <rect x="116" y="132" width="69.2" height="20" rx="2" fill="#C9A227" fill-opacity="0.10" stroke="#C9A227" stroke-opacity="0.34"/>
    <text class="mono" x="150.6" y="146" text-anchor="middle" font-size="10" fill="#C9A227" fill-opacity="0.95">Realtime</text>
  </g>
  </g>

  <g stroke="#C9A227" stroke-opacity="0.30" stroke-width="1" fill="none">
    <path d="M546 10 h-10 M546 10 v10"/>
    <path d="M546 166 h-10 M546 166 v-10"/>
  </g>
</svg>
